<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz día ma</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="stage" data-state="initial">
  <section id="card" tabindex="0" role="button" aria-label="Abrir la postal e iniciar el viaje">
    <img id="postal" src="assets/postal.png" alt="Postal del Día de la Madre: «No hay palabras para poder agradecerte todo lo que hiciste por mí, te amo mucho mami. ¡Feliz día ma!», con fotos familiares, aviones y mapas antiguos" draggable="false">
  </section>
  <div id="hint" aria-hidden="true">toca para volar</div>

  <div id="mapTiles" class="layer"></div>
  <div id="world" class="layer"><svg id="trail" width="1" height="1" aria-hidden="true"><path id="trailPath" fill="none"/></svg></div>
  <div id="photoTiles" class="layer"></div>
  <canvas id="smoke" aria-hidden="true"></canvas>

  <div id="plane" role="img" aria-label="Avión antiguo de hélices">
    <img src="assets/plane.png" alt="" draggable="false">
    <svg class="prop" viewBox="-10 -60 20 120" aria-hidden="true"><ellipse rx="5" ry="46" fill="#2b2118" opacity=".18"/><rect class="blade" x="-2" y="-46" width="4" height="92" rx="2" fill="#2b2118" opacity=".55"/><circle r="5" fill="#2b2118"/></svg>
  </div>

  <div id="veil"></div>
  <div id="sign" role="status" aria-live="polite"><div class="signPaper"><h2>Feliz 16° día de la madre</h2><p>Te amo mucho mami</p></div></div>
  <div id="flyHint" aria-hidden="true"></div>
  <button id="pause" type="button" aria-label="Pausar viaje" aria-pressed="false"><span class="ico"></span></button>
</main>
<script src="script.js"></script>
</body>
</html>
